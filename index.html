<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}

<body>
<main>
  <h1>MIO 写真19枚以下 × 入居日 一致判定</h1>
  <p class="note">写真v2.3と期日v18をそれぞれ独立判定。複数PDFをまとめて読み込み、最後に管理番号で重複を1件にまとめます。</p>

  <section class="card">
    <label class="drop" id="drop">
      <b>PDFをここにドラッグ</b>
      <small>またはクリックしてPDFを選択</small>
      <input id="file" type="file" accept=".pdf,application/pdf" multiple>
    </label>
    <div id="status">準備中…</div>
  </section>

  <section class="card">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap"><div class="count" id="count" style="margin-bottom:0">抽出 0件</div><button id="pdfBtn" class="copy" type="button">一覧をPDF保存</button><button id="shareBtn" class="copy" type="button">結果を共有</button></div>
      
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr><th>No.</th><th>管理番号</th><th>管理番号コピー</th><th>写真枚数</th><th>物件名</th><th>物件名コピー</th><th>号室</th><th>元付業者・電話</th><th>所在地</th><th>住所コピー</th><th>鍵所在</th><th>入居日</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
let pdfjs=null,hits=[];

const fileEl=document.getElementById('file');
const drop=document.getElementById('drop');
const statusEl=document.getElementById('status');
const tbody=document.getElementById('tbody');
const countEl=document.getElementById('count');


function status(s){statusEl.textContent=s}
function norm(s){return String(s||'').replace(/\s+/g,'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function range(v){return v.length?Math.max(...v)-Math.min(...v):0}

function loadScript(src){
  return new Promise((ok,ng)=>{
    const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);
  });
}
async function init(){
  for(const u of [
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'
  ]){
    try{
      await loadScript(u);
      if(window.pdfjsLib){pdfjs=window.pdfjsLib;status(`準備OK。基準：${getCutoff().label}`);return}
    }catch(e){}
  }
  status('PDF読取ライブラリの読み込みに失敗しました。');
}

function getCutoff(){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  let day,label;
  if(d<=10){day=10;label=`${m+1}月10日まで`}
  else if(d<=20){day=20;label=`${m+1}月20日まで`}
  else{day=new Date(y,m+1,0).getDate();label=`${m+1}月末日まで`}
  return {cutoff:new Date(y,m,day,23,59,59,999),label};
}

function toDate(year,month,tail){
  year=+year;month=+month;
  let day;
  if(tail==='上旬') day=10;
  else if(tail==='中旬') day=20;
  else if(tail==='下旬') day=new Date(year,month,0).getDate();
  else day=parseInt(tail,10);
  if(!day)return null;
  return new Date(year,month-1,day);
}

function findDateByColumn(row,empty,rowAxis,colAxis){
  const ep=empty[rowAxis];

  // 空室の近傍にある年トークン候補
  const years=row.filter(v=>{
    const s=norm(v.s);
    return /20\d{2}/.test(s) && Math.abs(v[rowAxis]-ep)<=30;
  }).sort((a,b)=>Math.abs(a[rowAxis]-ep)-Math.abs(b[rowAxis]-ep));

  for(const yearItem of years){
    const year=(norm(yearItem.s).match(/20\d{2}/)||[])[0];
    if(!year)continue;

    // 年トークンを中心に、同じ縦列っぽい文字を広めに取る
    const sameCol=row.filter(v=>Math.abs(v[rowAxis]-yearItem[rowAxis])<=6);

    // まず各トークン単体で月旬を探す
    for(const v of sameCol){
      const s=norm(v.s);
      const m=s.match(/(\d{1,2})月(上旬|中旬|下旬|\d{1,2}日?)/);
      if(m){
        const date=toDate(year,m[1],m[2]);
        if(date)return {text:`${year}年${m[1]}月${m[2]}`,date};
      }
    }

    // 月数字単体 + 月旬単体
    let month='';
    let tail='';
    for(const v of sameCol){
      const s=norm(v.s);
      if(/^\d{1,2}$/.test(s)){
        const n=+s;
        if(n>=1&&n<=12)month=String(n);
      }
      const m=s.match(/月(上旬|中旬|下旬|\d{1,2}日?)/);
      if(m)tail=m[1];
    }
    if(month&&tail){
      const date=toDate(year,month,tail);
      if(date)return {text:`${year}年${month}月${tail}`,date};
    }

    // 2027 + 1 + 月下旬 のような特殊分割を、
    // 年トークンからの座標距離が近い順で3〜6個連結して探索
    const ordered=sameCol
      .slice()
      .sort((a,b)=>Math.abs(a[colAxis]-yearItem[colAxis])-Math.abs(b[colAxis]-yearItem[colAxis]));

    for(let i=0;i<ordered.length;i++){
      let joined='';
      for(let j=i;j<Math.min(ordered.length,i+6);j++){
        joined+=norm(ordered[j].s);
        const m=joined.match(/(20\d{2}).*?(\d{1,2})月(上旬|中旬|下旬|\d{1,2}日?)/);
        if(m){
          const date=toDate(m[1],m[2],m[3]);
          if(date)return {text:`${m[1]}年${m[2]}月${m[3]}`,date};
        }
      }
    }

    // colAxisの昇順・降順でも連結
    for(const arr of [
      sameCol.slice().sort((a,b)=>a[colAxis]-b[colAxis]),
      sameCol.slice().sort((a,b)=>b[colAxis]-a[colAxis])
    ]){
      const joined=arr.map(v=>norm(v.s)).join('');
      const m=joined.match(/(20\d{2}).*?(\d{1,2})月(上旬|中旬|下旬|\d{1,2}日?)/);
      if(m){
        const date=toDate(m[1],m[2],m[3]);
        if(date)return {text:`${m[1]}年${m[2]}月${m[3]}`,date};
      }
    }
  }
  return null;
}


function compact(s){
  return String(s||'').replace(/\s+/g,' ').trim();
}

function isPlanToken(t){
  return /^(?:[1-9]?\d?\s*)?(?:S?LDK|LDK|DK|K|R|L|D|Ｓ?ＬＤＫ|ＬＤＫ|ＤＫ|Ｋ|Ｒ|ＳＬＤＫ|ＳＤＫ)$/i.test(
    String(t||'').replace(/\s+/g,'')
  );
}

function isRoomToken(t){
  t=compact(t);
  return /^(?:[A-Za-zＡ-Ｚａ-ｚ]?\d{1,5}|\d{1,5}[A-Za-zＡ-Ｚａ-ｚ]?|[A-Za-zＡ-Ｚａ-ｚ]\d{0,4})(?:[-－][A-Za-zＡ-Ｚａ-ｚ0-9０-９]+)?$/.test(t);
}

function extractExtraFields(row,id){
  const t=row.map(v=>compact(v.s)).filter(Boolean);
  let name='', room='', agent='', address='', adkey='';

  const idPos=t.findIndex(x=>x===id);
  const headTokens=t.slice(idPos+1, Math.min(t.length,idPos+16));

  // 物件名 + 交通 + 所在地 + 号室 + 間取り の先頭ブロックを分解
  let planIdx=-1;
  for(let i=0;i<headTokens.length;i++){
    if(isPlanToken(headTokens[i])) { planIdx=i; break; }
  }

  let prePlan = planIdx>=0 ? headTokens.slice(0,planIdx) : headTokens.slice();

  // 号室は間取り直前から逆向きに探す
  let roomIdx=-1;
  for(let i=prePlan.length-1;i>=0;i--){
    if(isRoomToken(prePlan[i])) { roomIdx=i; room=prePlan[i]; break; }
  }

  const cityRe=/^(宝塚市|西宮市|伊丹市|川西市|池田市|尼崎市|神戸市|芦屋市|三田市|豊中市|箕面市|吹田市|大阪市)/;
  let cityIdx=-1;
  for(let i=0;i<prePlan.length;i++){
    if(cityRe.test(prePlan[i])) { cityIdx=i; break; }
  }

  if(cityIdx>=0){
    // 所在地は市名から号室直前まで
    const addrEnd = roomIdx>cityIdx ? roomIdx : prePlan.length;
    address = prePlan.slice(cityIdx, addrEnd).join(' ').trim();

    // 物件名は市名より前のうち、交通開始前まで
    const left = prePlan.slice(0,cityIdx);
    let transitIdx = left.findIndex(x =>
      /^(JR|ＪＲ|阪急|阪神|能勢電鉄|神戸電鉄|神戸高速|大阪モノレール|北大阪急行|地下鉄|OsakaMetro|近鉄|京阪|山陽電鉄)/i.test(x)
    );
    if(transitIdx<0){
      // 「宝塚 南口」など駅名混入を避けるため、路線語を含むトークンでも切る
      transitIdx = left.findIndex(x => /(線|駅)$/.test(x));
    }
    name=(transitIdx>=0 ? left.slice(0,transitIdx) : left).join(' ').trim();
  }else{
    // 市名なしのときは交通語の前まで
    let transitIdx=prePlan.findIndex(x =>
      /^(JR|ＪＲ|阪急|阪神|能勢電鉄|神戸電鉄|神戸高速|大阪モノレール|北大阪急行|地下鉄|OsakaMetro|近鉄|京阪|山陽電鉄)/i.test(x)
    );
    name=(transitIdx>=0 ? prePlan.slice(0,transitIdx) : prePlan.slice(0,Math.max(1,roomIdx))).join(' ').trim();
  }

  // 物件名末尾に駅名断片が残る代表例を掃除
  name=name
    .replace(/\s+(宝塚南口|南口|宝塚|逆瀬川|仁川|小林|中山寺|中山観音|売布神社|清荒神|山本|川西能勢口)\s*$/,'')
    .replace(/\s+[A-ZＪ]+$/,'')
    .trim();

  // 元付業者＋電話
  const emptyIdx=t.findIndex(x=>x==='空室');
  if(emptyIdx>=0){
    let phoneIdx=-1;
    for(let i=emptyIdx-1;i>=Math.max(0,emptyIdx-10);i--){
      if(/0\d{1,4}[-－]\d{1,4}[-－]\d{3,4}/.test(t[i])){
        phoneIdx=i; break;
      }
    }
    if(phoneIdx>=0){
      let start=phoneIdx-1;
      while(start>=0 && /^(年|解|・)$/.test(t[start])) start--;
      // 会社名が2〜3トークンに分かれる場合を拾う
      let pieces=[];
      for(let i=start;i>=Math.max(0,start-3);i--){
        const x=t[i];
        if(/円|ヶ月|令和|平成|昭和|年|敷|礼|保|解/.test(x)) break;
        if(x==='・') break;
        pieces.unshift(x);
      }
      agent=(pieces.join(' ')+' '+t[phoneIdx]).trim();
      agent=agent
        .replace(/^\d{1,2}\s*月\s*/,'')
        .replace(/^\d{1,2}月\s*/,'')
        .trim();
    }else{
      for(let i=emptyIdx-1;i>=Math.max(0,emptyIdx-6);i--){
        if(t[i].length>=4 && !/円|令和|平成|昭和|年/.test(t[i])){
          agent=t[i]; break;
        }
      }
    }

    // AD＋鍵所在
    let extras=[];
    let sawPhotoDigits=false;
    for(let i=emptyIdx+1;i<t.length;i++){
      let x=t[i];

      // 入居日の断片を完全除外
      if(/[（(]?\s*20\d{2}/.test(x) ||
         /^年$/.test(x) ||
         /^\d{1,2}$/.test(x) && i<=emptyIdx+4 ||
         /^月(?:上旬|中旬|下旬)[）)]?$/.test(x) ||
         /^(?:上旬|中旬|下旬)[）)]?$/.test(x) ||
         /^月$/.test(x)) continue;

      // 写真1〜30の数字列が始まったら終了
      if(/^[0-9０-９]$/.test(x)){
        sawPhotoDigits=true;
        break;
      }

      if(/^(高大|コ|ス|病|高|大|小中)$/.test(x) || /^コ\s*ス\s*病$/.test(x)) break;

      extras.push(x);
      if(extras.length>=12) break;
    }
    adkey=extras.join(' ').trim();

    // 残った日付断片・末尾の写真番号を掃除
    adkey=adkey
      .replace(/^(?:年\s*)?\d{1,2}\s*月(?:上旬|中旬|下旬)[）)]?\s*/,'')
      .replace(/^(?:月\s*)?(?:上旬|中旬|下旬)[）)]?\s*/,'')
      .replace(/^[）)]\s*/,'')
      .replace(/(?:\s+[0-9０-９]){2,}(?:\s+(?:高大|小中|コ|ス|病|高|大))*\s*$/,'')
      .replace(/(?:\s+[0-9０-９]){2,}\s*$/,'')
      .replace(/\s+(?:高大|小中|コ\s*ス\s*病|コ|ス|病|高|大)\s*$/,'')
      .trim();

    // 表示するのは「鍵所在」の2列目だけ。
    // 先頭のAD値（1 / 0.5 / 20,000円 / 1.5-10,000円 等）を落とす。
    adkey=adkey
      .replace(/^\s*(?:\d+(?:\.\d+)?(?:\s*[-－]\s*[\d,]+(?:円)?)?|[\d,]+\s*円|一覧参照|HP参照)\s*/,'')
      // PDF内でAD金額が「5」＋「,000 円」のように分割された場合の残骸だけ除去
      .replace(/^\s*[,，]\s*\d{3}(?:\s*円)?\s*/,'')
      .replace(/^\s*[,，]\s*\d{3}\s*円\s*/,'')
      .trim();

    // 長文ADが鍵所在の前に残るケースだけ処理。
    // 「鍵っぽい語」が後ろにあればそこから表示、なければ広告文なので空欄。
    const promoLike = /^(?:★|☆|礼金|敷金|FR|ＦＲ|フリーレント|家賃|賃料|共込|キャンペーン|家事代行|契約事務手数料)/i;
    if(promoLike.test(adkey)){
      const keyMark = adkey.search(
        /(?:KB|ＫＢ|キーBOX|キーボックス|鍵|AL[:：]?|ＡＬ[:：]?|オートロック|ダイヤル|南京|ポスト|玄関|ガスメーター|駐輪場|雨樋|PS|ＰＳ|現地|立会|貸主|共通キー|呼\d|呼[：:]|部屋(?:オープン|OPEN)|元付|当社|賃住)/i
      );
      if(keyMark >= 0){
        adkey = adkey.slice(keyMark).trim();
      }else{
        adkey = '';
      }
    }

    // AD番号を落とした後に「（期間限定）」等だけ先頭へ残るケース
    adkey = adkey
      .replace(/^[（(][^）)]{0,20}[）)]\s*(?=(?:KB|ＫＢ|キー|鍵|AL|ＡＬ|オートロック|ダイヤル|南京|ポスト|玄関|現地|立会|呼))/i,'')
      .trim();
  }

  return {name,room,agent,address,adkey};
}
function digits(s){return (String(s).match(/[0-9０-９]/g)||[]).length}
function photoDigits(s){
  const t=String(s||'').trim();
  const m=t.match(/^([0-9０-９](?:\s+[0-9０-９])*)/);
  return m ? ((m[1].match(/[0-9０-９]/g)||[]).length) : 0;
}
function parsePhotoV23(items,page){
 const a=items.map(it=>({s:String(it.str||'').trim(),x:+(it.transform?.[4]||0),y:+(it.transform?.[5]||0)})).filter(v=>v.s);

 // 実物の管理番号列は Y≈19.55。10桁というだけでは判定しない。
 const ids=a.filter(v=>/^\d{10}$/.test(v.s) && v.y>=15 && v.y<=25).sort((p,q)=>p.x-q.x);
 const out=[];
 for(let i=0;i<ids.length;i++){
   const id=ids[i];
   // 写真欄は管理番号と同じ物件行の中だけを数える。
   // 次の管理番号の開始位置を境界にすることで、
   // 2段目・3段目は拾いつつ次の物件は混ぜない。
   const nextX = i+1<ids.length ? ids[i+1].x : id.x+30;
   const photo=a.filter(v=>
      v.y>=704 && v.y<=714 &&
      v.x>=id.x-1.5 && v.x<nextX-1.5 &&
      photoDigits(v.s)>0
   );
   let n=photo.reduce((sum,v)=>sum+photoDigits(v.s),0);
   if(n>30)n=30;
   out.push({id:id.s,photo:n,page});
 }
 return out;
}

function parseDateV18(items){
  const a=items.map(it=>({
    s:(it.str||'').trim(),x:it.transform[4],y:it.transform[5]
  })).filter(v=>v.s);

  const ids=a.filter(v=>/^\d{10}$/.test(v.s));
  if(!ids.length)return [];

  const rx=range(ids.map(v=>v.x)),ry=range(ids.map(v=>v.y));
  const rowAxis=rx>=ry?'x':'y';
  const colAxis=rowAxis==='x'?'y':'x';

  ids.sort((a,b)=>a[rowAxis]-b[rowAxis]);

  const out=[];
  const {cutoff}=getCutoff();

  for(let i=0;i<ids.length;i++){
    const id=ids[i],pos=id[rowAxis];
    const prev=i?ids[i-1][rowAxis]:null;
    const next=i+1<ids.length?ids[i+1][rowAxis]:null;

    let low,high;

    // MIOの1物件は「管理番号の位置から次の管理番号の直前まで」の縦帯。
    // 以前は管理番号同士の中間で切っていたため、
    // 「空室」の下にある入居日（管理番号より約13pt右）が次物件側へ落ちていた。
    if(next!==null){
      const step=Math.abs(next-pos);
      low=pos-step*.12;
      high=pos+step*.88;
    }else if(prev!==null){
      const step=Math.abs(pos-prev);
      low=pos-step*.12;
      high=pos+step*.88;
    }else{
      low=pos-3;
      high=pos+22;
    }

    if(low>high)[low,high]=[high,low];

    const row=a.filter(v=>v[rowAxis]>=low&&v[rowAxis]<=high);
    const empty=row.find(v=>norm(v.s)==='空室');
    if(!empty)continue;

    const move=findDateByColumn(row,empty,rowAxis,colAxis);

    // 日付ありで未来なら除外。日付なしは即時で残す。
    if(move && move.date>cutoff)continue;

    const fields=extractExtraFields(row,id.s);

    out.push({
      id:id.s,
      name:fields.name,
      room:fields.room,
      agent:fields.agent,
      address:fields.address,
      adkey:fields.adkey,
      dateText:move?move.text:'即時'
    });
  }
  return out;
}

async function readFiles(fileList){
  if(!pdfjs){status('まだ準備中です。');return}
  const files=[...fileList].filter(f=>/\.pdf$/i.test(f.name));
  if(!files.length)return;

  hits=[];render();
  let photoAll=[];
  let dateAll=[];
  let totalPages=0;
  const loaded=[];

  try{
    // 複数PDFをまとめて読み込み
    for(let fi=0;fi<files.length;fi++){
      const f=files[fi];
      const buf=await f.arrayBuffer();
      const pdf=await pdfjs.getDocument({data:new Uint8Array(buf),disableWorker:true}).promise;

      for(let p=1;p<=pdf.numPages;p++){
        status(
          `PDF ${fi+1}/${files.length} 読取中…\n`+
          `${f.name}\n${p}/${pdf.numPages}ページ`
        );
        const page=await pdf.getPage(p);
        const tc=await page.getTextContent();
        loaded.push({items:tc.items,page:p,file:f.name});
        totalPages++;
        await new Promise(r=>setTimeout(r,0));
      }
    }

    // STEP1 写真判定：v2.3そのまま
    for(let i=0;i<loaded.length;i++){
      const pg=loaded[i];
      status(`STEP1 写真判定中… ${i+1}/${loaded.length}ページ\n${pg.file}`);
      photoAll.push(...parsePhotoV23(pg.items,pg.page));
      await new Promise(r=>setTimeout(r,0));
    }

    // 管理番号で重複排除。同じ管理番号が複数PDFにあれば1件扱い。
    const photoUniqueMap=new Map();
    for(const r of photoAll){
      if(!photoUniqueMap.has(r.id)) photoUniqueMap.set(r.id,r);
    }
    const photoUnique=[...photoUniqueMap.values()];
    const photoUnder=photoUnique.filter(x=>x.photo<=19);
    const photoIds=new Set(photoUnder.map(x=>x.id));
    const photoMap=new Map(photoUnder.map(x=>[x.id,x.photo]));

    // STEP2 期日判定：v18そのまま
    for(let i=0;i<loaded.length;i++){
      const pg=loaded[i];
      status(`STEP2 期日判定中… ${i+1}/${loaded.length}ページ\n${pg.file}\n基準：${getCutoff().label}`);
      dateAll.push(...parseDateV18(pg.items));
      await new Promise(r=>setTimeout(r,0));
    }

    // 期日側も管理番号で重複排除
    const dateUniqueMap=new Map();
    for(const r of dateAll){
      if(!dateUniqueMap.has(r.id)) dateUniqueMap.set(r.id,r);
    }
    const dateUnique=[...dateUniqueMap.values()];

    // STEP3 管理番号の完全一致だけ
    hits=dateUnique
      .filter(r=>photoIds.has(r.id))
      .map((r,i)=>({...r,photo:photoMap.get(r.id),__originalOrder:i}));

    // 読み込み完了時に自動で市別に並べる
    sortByAddress(false);

    status(
      `読み込み完了：PDF ${files.length}個 / ${totalPages}ページ\n`+
      `全管理番号：${photoUnique.length.toLocaleString()}件\n`+
      `写真19枚以下：${photoUnder.length.toLocaleString()}件\n`+
      `期日対象：${dateUnique.length.toLocaleString()}件\n`+
      `両方一致：${hits.length.toLocaleString()}件\n`+
      `基準：${getCutoff().label}`
    );
  }catch(e){
    console.error(e);
    status('読取エラー：'+(e?.message||String(e)));
  }
}

function addressParts(addr){
  let s=String(addr||'').normalize('NFKC')
    .replace(/\s+/g,'')
    .replace(/[‐‑‒–—―−ー]/g,'-');

  // 市 → 町域 → 丁目 → 番地 → 号 の順で比較する。
  const city=(s.match(/^(.+?市)/)||['',''])[1];
  let rest=city ? s.slice(city.length) : s;

  let chome=0;
  const cm=rest.match(/([0-9]+)丁目/);
  if(cm){
    chome=Number(cm[1]);
    rest=rest.replace(/[0-9]+丁目/,'');
  }

  // 町域名は最初の数字が出る直前まで
  const tm=rest.match(/^([^0-9]+)/);
  const town=(tm?tm[1]:'').replace(/[-]+$/,'');
  const nums=(rest.slice(tm?tm[0].length:0).match(/[0-9]+/g)||[]).map(Number);

  return {
    city,
    town,
    chome,
    banchi:nums[0]??0,
    go:nums[1]??0,
    sub:nums[2]??0,
    raw:s
  };
}
function normalizeAddr(addr){
  return String(addr||'').normalize('NFKC')
    .replace(/\s+/g,'')
    .replace(/[‐‑‒–—―−ー]/g,'-');
}

function cityRank(addr){
  const s=normalizeAddr(addr);
  if(s.includes('宝塚市')) return 0;
  if(s.includes('伊丹市')) return 1;
  if(s.includes('西宮市')) return 2;
  if(s.includes('川西市')) return 3;
  return 99;
}

function addressPartsForSort(addr){
  const s=normalizeAddr(addr);

  let city='';
  for(const c of ['宝塚市','伊丹市','西宮市','川西市']){
    if(s.includes(c)){ city=c; break; }
  }

  let rest=city ? s.slice(s.indexOf(city)+city.length) : s;

  // 町名は、丁目・数字番地が始まる直前まで
  let town=rest;
  let chome=0, banchi=0, go=0, sub=0;

  const cm=rest.match(/^(.+?)([0-9]+)丁目(.*)$/);
  if(cm){
    town=cm[1];
    chome=Number(cm[2]);
    const nums=(cm[3].match(/[0-9]+/g)||[]).map(Number);
    banchi=nums[0]??0;
    go=nums[1]??0;
    sub=nums[2]??0;
  }else{
    const nm=rest.match(/^([^0-9]+?)(?=[0-9]|$)/);
    town=nm ? nm[1] : rest;
    const tail=nm ? rest.slice(nm[0].length) : '';
    const nums=(tail.match(/[0-9]+/g)||[]).map(Number);
    banchi=nums[0]??0;
    go=nums[1]??0;
    sub=nums[2]??0;
  }

  town=town.replace(/[-]+$/,'');
  return {city,town,chome,banchi,go,sub,raw:s};
}

function sortByAddress(showMessage=true){
  hits.sort((a,b)=>{
    const A=addressPartsForSort(a.address);
    const B=addressPartsForSort(b.address);

    // ① 市を指定順で完全に固める
    const cityDiff=cityRank(a.address)-cityRank(b.address);
    if(cityDiff!==0)return cityDiff;

    // ② 同じ市の中で町名ごとに固める
    let c=A.town.localeCompare(B.town,'ja',{numeric:true,sensitivity:'base'});
    if(c!==0)return c;

    // ③ 同じ町の中で丁目 → 番地 → 号
    if(A.chome!==B.chome)return A.chome-B.chome;
    if(A.banchi!==B.banchi)return A.banchi-B.banchi;
    if(A.go!==B.go)return A.go-B.go;
    if(A.sub!==B.sub)return A.sub-B.sub;

    return String(a.id||'').localeCompare(String(b.id||''),'ja',{numeric:true});
  });

  render();

  if(showMessage){
    status(`並び替え完了：宝塚市 → 伊丹市 → 西宮市 → 川西市\n各市の中は町名ごと → 丁目 → 番地順\n抽出：${hits.length}件\n基準：${getCutoff().label}`);
  }
}

function render(){
  countEl.textContent=`抽出 ${hits.length.toLocaleString()}件`;
  tbody.innerHTML=hits.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${esc(r.id)}</td>
      <td class="copy-ui"><button class="copy copy-btn" type="button" data-i="${i}" data-field="id">コピー</button></td>
      <td>${esc(r.photo)}枚</td>
      <td>${esc(r.name)}</td>
      <td class="copy-ui"><button class="copy copy-btn" type="button" data-i="${i}" data-field="name">コピー</button></td>
      <td>${esc(r.room)}</td>
      <td>${esc(r.agent)}</td>
      <td>${esc(r.address)}</td>
      <td class="copy-ui"><button class="copy copy-btn" type="button" data-i="${i}" data-field="address">コピー</button></td>
      <td class="key-location">${esc(r.adkey)}</td>
      <td>${esc(r.dateText)}</td>
    </tr>`).join('');
}

async function copyText(text){
  text=String(text||'');
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.left='-9999px';
    ta.style.top='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){return false;}
}

tbody.addEventListener('click',async e=>{
  const b=e.target.closest('.copy-btn');
  if(!b)return;

  const r=hits[Number(b.dataset.i)];
  const field=b.dataset.field;
  const text=field==='id' ? r.id : field==='name' ? r.name : r.address;

  const ok=await copyText(text);
  const original='コピー';
  if(ok){
    b.textContent='コピー済み';
    b.classList.add('copied');
    setTimeout(()=>{
      b.textContent=original;
      b.classList.remove('copied');
    },900);

    b.textContent='再試行';
    status('コピーに失敗しました。ブラウザの権限を確認して、もう一度押してください。');
    setTimeout(()=>{b.textContent=original},1200);
  }
});


// ===== 結果共有 =====
// GitHub Pagesで公開したページ自身のURLを土台にして、
// 判定結果をURLの #share= に圧縮保存します。
// 共有先はPDF不要で、このURLを開くだけで結果を復元します。

const shareBtn=document.getElementById('shareBtn');

function shareData(){
  return {
    v:1,
    cutoff:getCutoff().label,
    hits:hits.map(r=>({
      id:String(r.id||''),
      photo:Number(r.photo||0),
      name:String(r.name||''),
      room:String(r.room||''),
      agent:String(r.agent||''),
      address:String(r.address||''),
      adkey:String(r.adkey||''),
      dateText:String(r.dateText||'')
    }))
  };
}

function bytesToBase64Url(bytes){
  let bin='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  }
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function base64UrlToBytes(str){
  let s=str.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}

async function encodeShare(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));

  if('CompressionStream' in window){
    try{
      const cs=new CompressionStream('deflate-raw');
      const compressed=new Uint8Array(
        await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer()
      );
      return 'd'+bytesToBase64Url(compressed);
    }catch(e){}
  }

  return 'j'+bytesToBase64Url(raw);
}

async function decodeShare(str){
  try{
    const type=str.charAt(0);
    const bytes=base64UrlToBytes(str.slice(1));

    if(type==='d' && 'DecompressionStream' in window){
      const ds=new DecompressionStream('deflate-raw');
      const raw=new Uint8Array(
        await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer()
      );
      return JSON.parse(new TextDecoder().decode(raw));
    }

    if(type==='j'){
      return JSON.parse(new TextDecoder().decode(bytes));
    }
  }catch(e){
    console.error('共有結果の復元に失敗',e);
  }
  return null;
}

function getShareHash(){
  const h=location.hash||'';
  if(!h.startsWith('#share='))return '';
  return decodeURIComponent(h.slice(7));
}

async function restoreSharedResult(){
  const encoded=getShareHash();
  if(!encoded)return false;

  const data=await decodeShare(encoded);
  if(!data || !Array.isArray(data.hits))return false;

  hits=data.hits.map(r=>({
    id:r.id||'',
    photo:Number(r.photo||0),
    name:r.name||'',
    room:r.room||'',
    agent:r.agent||'',
    address:r.address||'',
    adkey:r.adkey||'',
    dateText:r.dateText||''
  }));

  sortByAddress(false);

  drop.style.display='none';
  fileEl.disabled=true;
  shareBtn.textContent='共有結果を表示中';

  status(
    `共有結果を読み込みました\n`+
    `抽出：${hits.length.toLocaleString()}件\n`+
    `基準：${data.cutoff||getCutoff().label}\n`+
    `この画面はPDFなしで共有結果を表示しています。`
  );

  return true;
}


function shortenWithIsGd(longUrl){
  return new Promise((resolve)=>{
    const cb='mioShort_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{
      cleanup();
      resolve(null);
    },10000);

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      script.remove();
    }

    window[cb]=(data)=>{
      const short=data && data.shorturl;
      cleanup();
      resolve(short && /^https:\/\/is\.gd\//.test(short) ? short : null);
    };

    script.onerror=()=>{
      cleanup();
      resolve(null);
    };

    script.src='https://is.gd/create.php?format=json&callback='+
      encodeURIComponent(cb)+'&url='+encodeURIComponent(longUrl);

    document.head.appendChild(script);
  });
}

shareBtn.addEventListener('click',async()=>{
  if(!hits.length){
    status('共有する結果がありません。先にPDFを読み込んでください。');
    return;
  }

  try{
    const encoded=await encodeShare(shareData());

    // 現在のGitHub Pages URLをそのまま土台にする。
    // 例：https://xxxxx.github.io/repo/
    //        ↓
    // https://xxxxx.github.io/repo/#share=xxxxx
    const url=new URL(window.location.href);
    url.hash='share='+encodeURIComponent(encoded);

    const longShareUrl=url.toString();

    // is.gd のJSONP APIを使って短縮。
    // fetch/CORSに依存せず、LINEで扱いやすい短いURLを作る。
    const shortUrl=await shortenWithIsGd(longShareUrl);

    if(shortUrl){
      const ok=await copyText(shortUrl);
      if(ok){
        shareBtn.textContent='短縮URLをコピーしました';
        status(
          `短縮URLをコピーしました\n`+
          `このURLをLINE等で送れば、PDFなしで同じ結果を表示できます。`
        );
        setTimeout(()=>shareBtn.textContent='結果を共有',1800);
      }else{
        window.prompt('この短縮URLをコピーしてください',shortUrl);
      }
    }else{
      // 短縮サービスが利用できない場合は元URLをコピー。
      const ok=await copyText(longShareUrl);
      if(ok){
        shareBtn.textContent='長いURLをコピーしました';
        status(
          `URL短縮サービスに接続できなかったため、元の共有URLをコピーしました。\\n`+
          `LINEで開けない場合はもう一度お試しください。`
        );
        setTimeout(()=>shareBtn.textContent='結果を共有',1800);
      }else{
        window.prompt('このURLをコピーしてください',longShareUrl);
      }
    }
  }catch(e){
    console.error(e);
    status('共有URLの作成に失敗しました。');
  }
});


fileEl.addEventListener('change',()=>readFiles(fileEl.files));
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>readFiles(e.dataTransfer.files));

render();
(async()=>{
  const restored=await restoreSharedResult();
  if(!restored) await init();
})();
